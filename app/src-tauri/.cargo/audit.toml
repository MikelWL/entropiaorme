# cargo-audit configuration
#
# Every advisory ignored here is on a transitive crate inside the Tauri
# toolchain, not a direct dependency of entropia-orme. None are exploitable
# in our Windows desktop embedding; none are fixable here without an
# upstream Tauri release that bumps the relevant subtree. Resolution path
# for each category is "wait for upstream"; the per-advisory comments below
# spell out why each is non-actionable in the shipped Windows artefact.
#
# Categorisation note: most entries below are `unmaintained` / `unsound`
# *warnings*. The two quick-xml advisories (RUSTSEC-2026-0194 / -0195) are
# genuine DoS *vulnerability* advisories, suppressed only because a
# reachability audit proved their XML-parse path is dead code in the shipped
# Windows artefact (see their inline rationale). The nightly `advisory-watch`
# job re-audits with those two un-suppressed after an in-range update and
# fails the moment a fix becomes reachable, so the suppression cannot outlive
# its justification.
#
# Review cadence: re-walk on every Tauri bump and whenever a new advisory
# fires against a crate in our transitive tree.

[advisories]
ignore = [
    # GTK3 bindings: unmaintained advisories on the entire gtk-rs GTK3 family,
    # transitive deps pulled by Tauri via webkit2gtk. The Linux build runs this
    # stack (Tauri's Linux backend is GTK3-bound, so every Tauri Linux app
    # carries these); the advisories are maintenance-status warnings, not
    # vulnerabilities. Not actionable until Tauri migrates off GTK3; re-walk
    # on every Tauri bump.
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys

    # glib: Iterator/DoubleEndedIterator unsoundness on `VariantStrIter`.
    # Transitive dep of the GTK stack the Linux build runs; the unsound
    # iterator is not on any first-party code path (we call no VariantStrIter
    # API), and the fix arrives with the upstream GTK-stack bump.
    "RUSTSEC-2024-0429", # glib

    # unic-*: family of unmaintained Unicode-data crates pulled transitively
    # through Tauri's macro/codegen tree. Build-time data-only crates; no
    # exploit surface in the runtime binary.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident

    # proc-macro-error: unmaintained build-time macro procedure crate.
    # Transitive build-dep; not present in the runtime binary.
    "RUSTSEC-2024-0370", # proc-macro-error

    # fxhash: unmaintained non-cryptographic hash. Transitive; no security
    # surface (not used for any cryptographic or trust-bearing path).
    "RUSTSEC-2025-0057", # fxhash

    # rand 0.7.3 + 0.8.5: unsoundness with a custom logger using `rand::rng()`.
    # Both versions are transitive through Tauri's codegen tree (phf /
    # selectors / cssparser / html5ever). Build-time path; "custom logger"
    # attack vector is not present in our embedding. Single advisory ID
    # covers both rand versions.
    "RUSTSEC-2026-0097", # rand (0.7.3, 0.8.5)

    # quick-xml 0.38.4 (via plist <- tauri-utils <- tauri): two DoS-class
    # *vulnerability* advisories, not the unmaintained/unsound warnings above.
    # Suppressed on a proven-non-reachability basis: the only runtime plist
    # XML-parse is `#[cfg(target_os = "macos")]` and reads the app's own bundle
    # Info.plist; the build-time parse is macOS+dev-gated over developer files;
    # the updater manifest is JSON, not XML; and no first-party crate parses XML
    # or plist. quick-xml is linked but its parse path is not compiled on
    # x86_64-pc-windows-msvc. -0195's `NsReader` API is not even instantiated by
    # plist (it uses the base `Reader`), so it is unreachable on every target.
    # Fixed by quick-xml >= 0.41.0; no released plist reaches it yet (1.9.0 still
    # pins 0.39.x). Drop both the moment plist bumps into range; the deny.toml
    # `wrappers = ["plist"]` ban pins the reachability assumption and the nightly
    # advisory-watch enforces the drop.
    "RUSTSEC-2026-0194", # quick-xml: quadratic duplicate-attribute check (DoS)
    "RUSTSEC-2026-0195", # quick-xml: unbounded NsReader ns-alloc (DoS; API unused by plist)
]
